apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spatial-proteomics
  namespace: spatial-proteomics
spec:
  rules:
    - host: spatial-proteomics.example.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

