apiVersion: apps/v1
kind: Deployment
metadata:
  name: spatial-proteomics-frontend
  namespace: spatial-proteomics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spatial-proteomics-frontend
  template:
    metadata:
      labels:
        app: spatial-proteomics-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/spatial-proteomics-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 8
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: spatial-proteomics
spec:
  selector:
    app: spatial-proteomics-frontend
  ports:
    - name: http
      port: 80
      targetPort: http

